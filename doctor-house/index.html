<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor House</title>
    <style>
        :root {
            --blue: #1e5eff;
            --blue-dark: #1747c4;
            --yellow: #ffc400;
            --yellow-dark: #e6b000;
            --text: #1c2233;
            --muted: #6b7489;
            --border: #e6e9f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }

        html { color-scheme: light; }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #ffffff;
            color: var(--text);
            min-height: 100vh;
        }

        /* Barre du haut : nom du site sur le côté */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            direction: ltr;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-decoration: none;
        }
        .logo .doctor { color: var(--blue); }
        .logo .house { color: var(--yellow); }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 16px;
            text-align: center;
        }

        /* Bouton Produits au centre */
        .products-btn {
            font-size: 22px;
            font-weight: 700;
            padding: 16px 48px;
            border: 2px solid var(--blue);
            background: #fff;
            color: var(--blue);
            border-radius: 14px;
            cursor: pointer;
            transition: all .2s ease;
        }
        .products-btn:hover,
        .products-btn.active {
            background: var(--blue);
            color: #fff;
        }

        /* Section cartes d'invitation */
        .section {
            display: none;
            margin-top: 50px;
            animation: fadeIn .3s ease;
        }
        .section.open { display: block; }

        .section h2 {
            font-size: 26px;
            margin-bottom: 30px;
            color: var(--text);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        /* Fenêtre */
        .window {
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 6px 20px rgba(30, 94, 255, .08);
            display: flex;
            flex-direction: column;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .window:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(30, 94, 255, .15);
        }

        .window-bar {
            background: var(--blue);
            color: #fff;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dots { display: flex; gap: 5px; direction: ltr; }
        .dots span {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,.55);
        }
        .dots span:first-child { background: var(--yellow); }

        .window-body {
            padding: 26px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .label { color: var(--muted); font-size: 14px; }
        .value {
            direction: ltr;
            font-size: 32px;
            font-weight: 800;
            color: var(--blue);
        }
        .price {
            direction: ltr;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .pay-btn {
            margin-top: auto;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--yellow);
            color: #1c2233;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background .2s ease;
        }
        .pay-btn:hover { background: var(--yellow-dark); }

        /* Fenêtre de paiement */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(20, 25, 40, .45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-bg.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            border-top: 6px solid var(--yellow);
        }
        .modal h3 { margin-bottom: 12px; color: var(--blue); }
        .modal p { margin-bottom: 8px; }
        .modal .close {
            margin-top: 16px;
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }


        /* Actions : notifications + profil */
        .actions { display: flex; align-items: center; gap: 10px; position: relative; }
        .icon-btn {
            position: relative;
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid var(--blue);
            background: #fff;
            color: var(--blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-weight: 800; font-size: 15px;
            transition: all .2s ease;
        }
        .icon-btn:hover { background: var(--blue); color: #fff; }
        .icon-btn svg { width: 22px; height: 22px; }
        .icon-btn.logged { background: var(--blue); color: #fff; }
        .badge {
            position: absolute; top: -4px; right: -4px;
            min-width: 18px; height: 18px; padding: 0 4px;
            border-radius: 9px;
            background: var(--yellow); color: var(--text);
            font-size: 11px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }
        .dropdown {
            position: absolute; top: 54px; right: 0;
            width: min(300px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(30, 94, 255, .15);
            text-align: left;
            z-index: 20;
            overflow: hidden;
        }
        .dropdown h4 {
            padding: 12px 16px;
            background: var(--blue); color: #fff; font-size: 15px;
        }
        .notif { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .notif:last-child { border-bottom: none; }
        .notif small { display: block; color: var(--muted); margin-top: 4px; }
        .empty { padding: 16px; color: var(--muted); font-size: 14px; }

        /* Formulaire d'inscription */
        .form { display: flex; flex-direction: column; gap: 12px; text-align: left; margin-top: 8px; }
        .form label { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
        .form input {
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text);
            background: #fff;
        }
        .form input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
        .form .error { color: #d12c2c; font-size: 13px; min-height: 16px; }
        .submit-btn {
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--yellow);
            color: var(--text);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }
        .submit-btn:hover { background: var(--yellow-dark); }
        .link-btn {
            background: none; border: none; color: var(--muted);
            font-size: 14px; cursor: pointer; margin-top: 10px; text-decoration: underline;
        }
        .profile-info { text-align: left; display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .profile-info span { color: var(--muted); font-size: 13px; display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 600px) {
            header { padding: 16px; }
            .logo { font-size: 24px; }
            main { padding: 40px 16px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="#"><span class="doctor">Doctor</span> <span class="house">House</span></a>
        <div class="actions">
            <button class="icon-btn" id="notifBtn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                <span class="badge" id="notifBadge" hidden>0</span>
            </button>
            <button class="icon-btn" id="profileBtn" aria-label="Profil">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </button>
            <div class="dropdown" id="notifMenu" hidden>
                <h4>Notifications</h4>
                <div id="notifList"></div>
            </div>
        </div>
    </header>

    <main>
        <button class="products-btn" id="productsBtn">Produits</button>

        <section class="section" id="invites">
            <h2>Cartes d'invitation</h2>
            <div class="grid" id="grid"></div>
        </section>
    </main>

    <div class="modal-bg" id="modal">
        <div class="modal">
            <h3>Paiement</h3>
            <p id="modalCard"></p>
            <p id="modalPrice"></p>
            <button class="close" id="closeModal">Fermer</button>
        </div>
    </div>

    <div class="modal-bg" id="signupModal">
        <div class="modal">
            <h3>Créer un compte</h3>
            <form class="form" id="signupForm" novalidate>
                <label>Prénom<input id="firstName" type="text" autocomplete="given-name" required></label>
                <label>Nom<input id="lastName" type="text" autocomplete="family-name" required></label>
                <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
                <label>Mot de passe<input id="password" type="password" autocomplete="new-password" required minlength="6"></label>
                <div class="error" id="signupError"></div>
                <button class="submit-btn" type="submit">S'inscrire</button>
            </form>
            <button class="link-btn" data-close="signupModal">Annuler</button>
        </div>
    </div>

    <div class="modal-bg" id="profileModal">
        <div class="modal">
            <h3>Mon profil</h3>
            <div class="profile-info">
                <div><span>Nom complet</span><strong id="pName"></strong></div>
                <div><span>E-mail</span><strong id="pEmail"></strong></div>
            </div>
            <button class="close" id="logoutBtn">Se déconnecter</button>
            <br>
            <button class="link-btn" data-close="profileModal">Fermer</button>
        </div>
    </div>

    <script>
        const cards = [
            { id: 1, value: '2500 EUR', price: '280 USDT' },
            { id: 2, value: '1900 EUR', price: '180 USDT' },
            { id: 3, value: '5500 EUR', price: '511 USDT' },
            { id: 4, value: '1500 EUR', price: '90 USDT' },
        ];

        const grid = document.getElementById('grid');
        grid.innerHTML = cards.map(c => `
            <div class="window">
                <div class="window-bar">
                    <span>Carte d'invitation ${c.id}</span>
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
                <div class="window-body">
                    <div class="label">Valeur de la carte</div>
                    <div class="value">${c.value}</div>
                    <div class="label">Prix</div>
                    <div class="price">${c.price}</div>
                    <button class="pay-btn" data-id="${c.id}">Payer maintenant</button>
                </div>
            </div>
        `).join('');

        const btn = document.getElementById('productsBtn');
        const section = document.getElementById('invites');
        btn.addEventListener('click', () => {
            section.classList.toggle('open');
            btn.classList.toggle('active');
        });

        const modal = document.getElementById('modal');
        grid.addEventListener('click', e => {
            const pay = e.target.closest('.pay-btn');
            if (!pay) return;
            const c = cards.find(x => x.id == pay.dataset.id);
            document.getElementById('modalCard').textContent = `Carte d'invitation ${c.id} — ${c.value}`;
            document.getElementById('modalPrice').textContent = `Montant : ${c.price}`;
            modal.classList.add('open');
        });
        document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('open'));
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
        // Compte (stocké uniquement dans ce navigateur ; le mot de passe n'est jamais enregistré)
        const KEY = 'dh_user';
        function getUser() {
            try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
        }
        function setUser(u) {
            try { u ? localStorage.setItem(KEY, JSON.stringify(u)) : localStorage.removeItem(KEY); return true; } catch (e) { return false; }
        }
        let user = getUser();

        const profileBtn = document.getElementById('profileBtn');
        const signupModal = document.getElementById('signupModal');
        const profileModal = document.getElementById('profileModal');

        if (user) {
            profileBtn.classList.add('logged');
            profileBtn.textContent = (user.firstName[0] + user.lastName[0]).toUpperCase();
            document.getElementById('pName').textContent = user.firstName + ' ' + user.lastName;
            document.getElementById('pEmail').textContent = user.email;
        }

        profileBtn.addEventListener('click', () => {
            (user ? profileModal : signupModal).classList.add('open');
            if (!user) document.getElementById('firstName').focus();
        });

        document.getElementById('signupForm').addEventListener('submit', e => {
            e.preventDefault();
            const f = id => document.getElementById(id).value.trim();
            const err = document.getElementById('signupError');
            if (!f('firstName') || !f('lastName') || !f('email') || !f('password')) {
                err.textContent = 'Veuillez remplir tous les champs.'; return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f('email'))) {
                err.textContent = 'Adresse e-mail invalide.'; return;
            }
            if (f('password').length < 6) {
                err.textContent = 'Le mot de passe doit contenir au moins 6 caractères.'; return;
            }
            const ok = setUser({ firstName: f('firstName'), lastName: f('lastName'), email: f('email'), since: Date.now() });
            if (!ok) { err.textContent = "Impossible d'enregistrer le compte dans ce navigateur."; return; }
            location.reload();
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            setUser(null);
            location.reload();
        });

        document.querySelectorAll('[data-close]').forEach(b =>
            b.addEventListener('click', () => document.getElementById(b.dataset.close).classList.remove('open')));
        [signupModal, profileModal].forEach(m =>
            m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

        // Notifications
        const notifs = user ? [
            { text: `Bienvenue ${user.firstName} ! Votre compte a été créé.`, when: new Date(user.since).toLocaleString('fr-FR') },
            { text: "Découvrez nos cartes d'invitation dans Produits.", when: '' },
        ] : [];
        const notifBadge = document.getElementById('notifBadge');
        const notifMenu = document.getElementById('notifMenu');
        document.getElementById('notifList').innerHTML = notifs.length
            ? notifs.map(n => `<div class="notif">${n.text.replace(/</g, '&lt;')}${n.when ? `<small>${n.when}</small>` : ''}</div>`).join('')
            : '<div class="empty">Connectez-vous pour recevoir des notifications.</div>';
        if (notifs.length) { notifBadge.textContent = notifs.length; notifBadge.hidden = false; }
        document.getElementById('notifBtn').addEventListener('click', e => {
            e.stopPropagation();
            notifMenu.hidden = !notifMenu.hidden;
            notifBadge.hidden = true;
        });
        document.addEventListener('click', e => {
            if (!notifMenu.contains(e.target)) notifMenu.hidden = true;
        });
    </script>
</body>
</html>
