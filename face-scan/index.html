<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماسح الوجه بالليزر</title>
<style>
  :root { --laser: #00ff66; --laser-glow: rgba(0, 255, 102, 0.6); }
  body.smile { --laser: #ff1f3d; --laser-glow: rgba(255, 31, 61, 0.6); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; color: var(--laser); overflow: hidden;
    font-family: 'Courier New', monospace; }

  #stage { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); }
  video { filter: grayscale(0.6) brightness(0.55) contrast(1.2); }

  /* scanlines */
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 3px); }

  .hud { position: fixed; z-index: 5; padding: 12px 16px; font-size: 14px; line-height: 1.7;
    text-shadow: 0 0 8px var(--laser-glow); transition: color .3s; }
  #title { top: 0; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: bold;
    letter-spacing: 2px; border-bottom: 1px solid var(--laser); background: rgba(0,0,0,.5); }
  #stats { bottom: 16px; right: 16px; background: rgba(0,0,0,.55); border: 1px solid var(--laser);
    box-shadow: 0 0 15px var(--laser-glow); min-width: 230px; }
  #stats b { float: left; margin-right: 12px; }
  .bar { height: 6px; border: 1px solid var(--laser); margin: 4px 0 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--laser);
    box-shadow: 0 0 8px var(--laser); transition: width .1s; }

  #status { bottom: 16px; left: 16px; background: rgba(0,0,0,.55); border: 1px solid var(--laser);
    font-size: 16px; font-weight: bold; }
  body.smile #status { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; background: #000; text-align: center;
    padding: 16px; }
  #overlay p { font-size: 18px; text-shadow: 0 0 10px var(--laser-glow); }
  #overlay button { font: inherit; font-size: 18px; padding: 12px 28px; color: var(--laser);
    background: transparent; border: 2px solid var(--laser); cursor: pointer;
    box-shadow: 0 0 15px var(--laser-glow); display: none; }
  .spinner { width: 60px; height: 60px; border: 3px solid transparent; border-top-color: var(--laser);
    border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .hud { font-size: 12px; }
    #title { font-size: 15px; }
    #stats { min-width: 170px; right: 8px; bottom: 8px; }
    #status { left: 8px; bottom: auto; top: 56px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="title" class="hud">◉ نظام تحليل الوجه بالليزر ◉</div>
<div id="status" class="hud">جاري البحث عن وجه...</div>
<div id="stats" class="hud">
  <div>الابتسامة <b id="smileVal">0%</b></div>
  <div class="bar"><i id="smileBar"></i></div>
  <div>العين اليسرى <b id="eyeL">--</b></div>
  <div>العين اليمنى <b id="eyeR">--</b></div>
  <div>زاوية الرأس <b id="yaw">--</b></div>
  <div>النقاط المرصودة <b id="pts">0</b></div>
  <div>FPS <b id="fps">0</b></div>
</div>

<div id="overlay">
  <div class="spinner" style="display:none"></div>
  <p id="msg">اضغط الزر وأعطِ الإذن للكاميرا لبدء تحليل وجهك بالليزر</p>
  <button id="retry" style="display:block">▶ ابدأ المسح</button>
</div>

<script type="module">
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const retry = document.getElementById("retry");
const spinner = document.querySelector(".spinner");
const $ = id => document.getElementById(id);

const SMILE_ON = 0.45, SMILE_OFF = 0.3; // hysteresis so the colour doesn't flicker
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const VERSION = "0.10.14";
const CDNS = [
  `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VERSION}`,
  `https://unpkg.com/@mediapipe/tasks-vision@${VERSION}`
];
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

let FaceLandmarker, landmarker, smiling = false, lastVideoTime = -1, frames = 0, fpsTime = performance.now();
let looping = false;

const withTimeout = (p, ms, label) => Promise.race([p,
  new Promise((_, rej) => setTimeout(() => rej(new Error(label)), ms))]);

// Loaded dynamically (not a static import) so a CDN failure shows an error instead of a dead page.
async function loadModel() {
  let lastErr;
  for (const cdn of CDNS) {
    try {
      const vision = await withTimeout(import(`${cdn}/vision_bundle.mjs`), 20000, "انتهت مهلة تحميل المكتبة");
      FaceLandmarker = vision.FaceLandmarker;
      const fileset = await vision.FilesetResolver.forVisionTasks(`${cdn}/wasm`);
      const opts = delegate => ({
        baseOptions: { modelAssetPath: MODEL, delegate },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: true
      });
      try { return await withTimeout(FaceLandmarker.createFromOptions(fileset, opts("GPU")), 30000, "GPU"); }
      catch { return await withTimeout(FaceLandmarker.createFromOptions(fileset, opts("CPU")), 30000, "انتهت مهلة تحميل النموذج"); }
    } catch (e) { lastErr = e; console.error(cdn, e); }
  }
  throw lastErr;
}

async function startCamera() {
  if (video.srcObject) return;
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  video.srcObject = stream;
  if (video.readyState < 1) await new Promise(r => video.addEventListener("loadedmetadata", r, { once: true }));
  await video.play();
}

function showError(text) {
  overlay.style.display = "flex";
  spinner.style.display = "none";
  msg.textContent = text;
  retry.textContent = "إعادة المحاولة";
  retry.style.display = "block";
}

async function init() {
  retry.style.display = "none";
  spinner.style.display = "block";

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    return showError("الكاميرا لا تعمل هنا. افتح الرابط في متصفح Chrome أو Safari (وليس داخل تطبيق) وعبر https.");
  }

  // 1) camera first, so the user sees themselves right away
  msg.textContent = "جاري تشغيل الكاميرا...";
  try {
    await startCamera();
  } catch (e) {
    console.error(e);
    return showError(e.name === "NotAllowedError"
      ? "تم رفض الوصول للكاميرا. اسمح بالكاميرا من إعدادات المتصفح ثم اضغط إعادة المحاولة."
      : e.name === "NotFoundError"
        ? "لم يتم العثور على كاميرا في هذا الجهاز."
        : e.name === "NotReadableError"
          ? "الكاميرا مستعملة من تطبيق آخر. أغلقه ثم أعد المحاولة."
          : "تعذر تشغيل الكاميرا: " + (e.message || e));
  }
  overlay.style.display = "none";

  // 2) then the face model; the camera stays visible while it loads
  if (!landmarker) {
    $("status").textContent = "جاري تحميل نظام الليزر...";
    try {
      landmarker = await loadModel();
    } catch (e) {
      $("status").textContent = "تعذر تحميل نظام التحليل — تحقق من الإنترنت";
      return showError("الكاميرا تعمل لكن تعذر تحميل نموذج تحليل الوجه. تحقق من اتصال الإنترنت ثم أعد المحاولة. (" + (e.message || e) + ")");
    }
  }
  $("status").textContent = "جاري البحث عن وجه...";
  if (!looping) { looping = true; requestAnimationFrame(loop); }
}
retry.onclick = init;

// Map normalized landmark coords to canvas pixels, accounting for object-fit: cover cropping.
function mapper() {
  const vw = video.videoWidth, vh = video.videoHeight, cw = canvas.width, ch = canvas.height;
  const s = Math.max(cw / vw, ch / vh);
  const ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  return p => ({ x: p.x * vw * s + ox, y: p.y * vh * s + oy });
}

function resize() {
  canvas.width = innerWidth * DPR;
  canvas.height = innerHeight * DPR;
}
addEventListener("resize", resize);
resize();

function blend(cats, name) {
  return cats.find(c => c.categoryName === name)?.score ?? 0;
}

function drawFace(lm, color, t) {
  const map = mapper();
  const pts = lm.map(map);
  const dpr = DPR;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const pad = 20 * dpr;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const w = maxX - minX, h = maxY - minY;

  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;

  // Faint mesh
  ctx.globalAlpha = 0.25;
  ctx.lineWidth = 0.6 * dpr;
  ctx.shadowBlur = 0;
  ctx.beginPath();
  for (const { start, end } of FaceLandmarker.FACE_LANDMARKS_TESSELATION) {
    ctx.moveTo(pts[start].x, pts[start].y);
    ctx.lineTo(pts[end].x, pts[end].y);
  }
  ctx.stroke();

  // Bright feature contours
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = 1.6 * dpr;
  ctx.shadowBlur = 10 * dpr;
  ctx.beginPath();
  for (const set of [FaceLandmarker.FACE_LANDMARKS_FACE_OVAL, FaceLandmarker.FACE_LANDMARKS_LIPS,
    FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
    FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW]) {
    for (const { start, end } of set) {
      ctx.moveTo(pts[start].x, pts[start].y);
      ctx.lineTo(pts[end].x, pts[end].y);
    }
  }
  ctx.stroke();

  // Laser dots
  ctx.shadowBlur = 6 * dpr;
  for (let i = 0; i < pts.length; i += 4) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t / 150 + i);
    ctx.fillRect(pts[i].x - dpr, pts[i].y - dpr, 2 * dpr, 2 * dpr);
  }

  // Sweeping laser scan line inside the face box
  const sweep = minY + ((Math.sin(t / 500) + 1) / 2) * h;
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 25 * dpr;
  ctx.lineWidth = 3 * dpr;
  ctx.beginPath();
  ctx.moveTo(minX, sweep);
  ctx.lineTo(maxX, sweep);
  ctx.stroke();
  const grad = ctx.createLinearGradient(0, sweep - 40 * dpr, 0, sweep);
  grad.addColorStop(0, "transparent");
  grad.addColorStop(1, color);
  ctx.globalAlpha = 0.25;
  ctx.shadowBlur = 0;
  ctx.fillStyle = grad;
  ctx.fillRect(minX, sweep - 40 * dpr, w, 40 * dpr);
  ctx.fillStyle = color;

  // Laser beams from the top corners to the eyes (landmarks 468/473 are the irises)
  const eyes = [pts[468] || pts[33], pts[473] || pts[263]];
  const origins = [{ x: 0, y: 0 }, { x: canvas.width, y: 0 }];
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 1.5 * dpr;
  ctx.shadowBlur = 15 * dpr;
  // canvas is mirrored via CSS, so origin[0] shows on the right; pair each beam with the nearer eye
  const sorted = [...eyes].sort((a, b) => a.x - b.x);
  ctx.beginPath();
  ctx.moveTo(origins[0].x, origins[0].y); ctx.lineTo(sorted[0].x, sorted[0].y);
  ctx.moveTo(origins[1].x, origins[1].y); ctx.lineTo(sorted[1].x, sorted[1].y);
  ctx.stroke();
  for (const e of eyes) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, (6 + 3 * Math.sin(t / 100)) * dpr, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Corner brackets
  ctx.globalAlpha = 1;
  ctx.lineWidth = 3 * dpr;
  ctx.shadowBlur = 12 * dpr;
  const c = Math.min(w, h) * 0.18;
  ctx.beginPath();
  for (const [x, y, dx, dy] of [[minX, minY, 1, 1], [maxX, minY, -1, 1], [minX, maxY, 1, -1], [maxX, maxY, -1, -1]]) {
    ctx.moveTo(x + dx * c, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * c);
  }
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function loop() {
  const t = performance.now();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, t);
    const face = res.faceLandmarks?.[0];

    if (face) {
      const cats = res.faceBlendshapes?.[0]?.categories ?? [];
      const smile = (blend(cats, "mouthSmileLeft") + blend(cats, "mouthSmileRight")) / 2;
      if (!smiling && smile > SMILE_ON) smiling = true;
      else if (smiling && smile < SMILE_OFF) smiling = false;
      document.body.classList.toggle("smile", smiling);

      const color = smiling ? "#ff1f3d" : "#00ff66";
      drawFace(face, color, t);

      const blinkL = blend(cats, "eyeBlinkLeft"), blinkR = blend(cats, "eyeBlinkRight");
      const yaw = (face[454].z - face[234].z) * 200; // rough head turn from cheek depth difference
      $("smileVal").textContent = Math.round(smile * 100) + "%";
      $("smileBar").style.width = Math.round(smile * 100) + "%";
      $("eyeL").textContent = blinkR > 0.5 ? "مغلقة" : "مفتوحة"; // mirrored
      $("eyeR").textContent = blinkL > 0.5 ? "مغلقة" : "مفتوحة";
      $("yaw").textContent = Math.round(yaw) + "°";
      $("pts").textContent = face.length;
      $("status").textContent = smiling ? "⚠ تم رصد ابتسامة ⚠" : "✓ جاري تحليل الوجه...";
    } else {
      smiling = false;
      document.body.classList.remove("smile");
      $("status").textContent = "جاري البحث عن وجه...";
      $("pts").textContent = "0";
      $("smileVal").textContent = "0%";
      $("smileBar").style.width = "0";
    }

    frames++;
    if (t - fpsTime >= 1000) {
      $("fps").textContent = frames;
      frames = 0;
      fpsTime = t;
    }
  }
  requestAnimationFrame(loop);
}

</script>
</body>
</html>
