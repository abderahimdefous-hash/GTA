<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Da9awi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Intro screen: a click is needed before the browser lets the face speak -->
  <section id="intro" class="intro">
    <div class="intro-orb"></div>
    <h1>مرحبا بيك 👋</h1>
    <p>Da9awi، الذكاء الاصطناعي ديالك، كيتسناك باش تهضر معاه</p>
    <button id="enterBtn" class="enter-btn">دخل وهضر مع Da9awi</button>
  </section>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="dot"></span> Da9awi</div>
      <select id="langSelect" aria-label="اللغة">
        <option value="ar-MA">الدارجة / العربية</option>
        <option value="fr-FR">Français</option>
        <option value="en-US">English</option>
      </select>
    </header>

    <section class="stage">
      <div class="halo"></div>
      <canvas id="face3d" class="face" aria-label="وجه الذكاء الاصطناعي 3D"></canvas>

      <div id="status" class="status">واجد…</div>
      <div id="caption" class="caption"></div>
    </section>

    <section class="chat">
      <div id="log" class="log" aria-live="polite"></div>
      <form id="form" class="composer">
        <button type="button" id="micBtn" class="mic" title="هضر بالميكرو" aria-label="ميكرو">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <input id="input" type="text" autocomplete="off" placeholder="كتب شي حاجة ولا ضغط على الميكرو…">
        <button type="submit" class="send" aria-label="صيفط">➤</button>
      </form>
      <label class="voice-toggle"><input type="checkbox" id="voiceToggle" checked> الصوت شغال</label>
    </section>
  </main>

  <script src="face3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
